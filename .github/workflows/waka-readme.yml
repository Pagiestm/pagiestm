name: Statistiques WakaTime

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  waka:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: athul/waka-readme@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHOW_TITLE: "false"
          TIME_RANGE: last_7_days
          LANG_COUNT: "6"
          SHOW_TIME: "true"
          SHOW_TOTAL: "true"
          CODE_LANG: "text"
          COMMIT_MESSAGE: "chore: mise a jour des stats de code"
